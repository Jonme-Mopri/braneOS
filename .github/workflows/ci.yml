# ============================================================
# Brane OS — CI Pipeline (GitHub Actions)
# ============================================================
# Runs on every push and pull request to main.
# Validates:
#   1. Kernel compiles for x86_64-unknown-none
#   2. Code formatting (rustfmt)
#   3. Lints (clippy)
#   4. Kernel unit tests
#   5. Deterministic stress and mutation-fuzz tests
#   6. Release artifact — ISO packaging, checksum and CD boot
#   7. Boot test — QEMU serial output verification (60 s timeout)
#   8. ACPI S3 test — suspend, QMP wake and post-resume shell
#   9. Security tests — capability denial and privilege escalation
#  10. Integration tests — syscalls/services and capability broker
#  11. E2E tests — shell readiness and complete boot sequence
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # -----------------------------------------------------------------
  # Build — compile the kernel for bare-metal x86_64
  # -----------------------------------------------------------------
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-11
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (debug)
        run: cargo build -p brane_os_kernel --target x86_64-unknown-none

      - name: Build (release)
        run: cargo build -p brane_os_kernel --target x86_64-unknown-none --release

  # -----------------------------------------------------------------
  # Format — check code formatting with rustfmt
  # -----------------------------------------------------------------
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-11
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # -----------------------------------------------------------------
  # Clippy — lint checks
  # -----------------------------------------------------------------
  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-11
          components: clippy, rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clippy-

      - name: Run Clippy
        run: cargo clippy -p brane_os_kernel --target x86_64-unknown-none -- -D warnings

      - name: Run Runner Clippy
        run: cargo clippy -p runner --all-targets -- -D warnings

  # -----------------------------------------------------------------
  # Tests — host-side unit tests for kernel logic
  # -----------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-11
          components: rust-src

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tests-

      - name: Run kernel unit tests
        run: cargo test -p brane_os_kernel --lib

  # -----------------------------------------------------------------
  # Stability — deterministic parser fuzzing and subsystem stress
  # -----------------------------------------------------------------
  stability-tests:
    name: Stress and Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-11
          components: rust-src

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-stability-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-stability-
            ${{ runner.os }}-tests-

      - name: Run deterministic stress and fuzz suites
        run: make stress-test

  # -----------------------------------------------------------------
  # Release artifact — package ISO, verify checksum and boot from CD
  # -----------------------------------------------------------------
  release-artifact:
    name: Release Artifact (ISO)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-11
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-
            ${{ runner.os }}-cargo-

      - name: Install QEMU and xorriso
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso

      - name: Build and boot release ISO
        env:
          BOOT_TIMEOUT: "90"
        run: make release-test VERSION=ci

      - name: Verify SHA-256 checksum
        working-directory: dist
        run: sha256sum --check brane_os_vci.iso.sha256

      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: brane-os-release-candidate
          path: |
            dist/brane_os_vci.iso
            dist/brane_os_vci.iso.sha256
            dist/brane_os_vci-bios.img
            dist/brane_os_vci-uefi.img
            dist/brane_os_vci_release.tar.gz
          if-no-files-found: error

  # -----------------------------------------------------------------
  # Boot Test — run Brane OS in QEMU and verify serial output
  # -----------------------------------------------------------------
  boot-test:
    name: Boot Test (QEMU)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-11
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-boot-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-boot-

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Run boot test
        timeout-minutes: 5
        env:
          BOOT_TIMEOUT: "60"
        run: python3 tests/boot/test_boot.py

  # -----------------------------------------------------------------
  # Runtime Suites — security, integration and E2E checks in QEMU
  # -----------------------------------------------------------------
  runtime-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PCIe ECAM Test (Q35)
            suite: pcie
            target: pcie-test
            boot_timeout: "60"
          - name: ACPI S3 Test (QEMU)
            suite: acpi
            target: acpi-test
            boot_timeout: "120"
          - name: Security Tests (QEMU)
            suite: security
            target: security-test
            boot_timeout: "90"
          - name: Integration Tests (QEMU)
            suite: integration
            target: integration-test
            boot_timeout: "90"
          - name: E2E Tests (QEMU)
            suite: e2e
            target: e2e-test
            boot_timeout: "120"
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-11
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-runtime-${{ matrix.suite }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-runtime-${{ matrix.suite }}-
            ${{ runner.os }}-cargo-

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Run ${{ matrix.name }}
        timeout-minutes: 12
        env:
          BOOT_TIMEOUT: ${{ matrix.boot_timeout }}
        run: make ${{ matrix.target }}
